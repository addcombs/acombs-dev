spring.application.name=acombs-dev-api

# Only the health endpoint is exposed, without component details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Optional: comma-separated browser origins allowed to call the health endpoint cross-origin, e.g. the
# deployed UI. Empty (the default) allows none; the local UI reaches the API through its dev-server proxy.
management.endpoints.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
management.endpoints.web.cors.allowed-methods=GET
management.endpoints.web.cors.max-age=1h

# Declare UTF-8 on every response. Without a charset (e.g. Swagger UI's .js and .css), the Lambda
# adapter decodes the body as ISO-8859-1 and Lambda re-encodes it as UTF-8, corrupting any non-ASCII
# bytes; the corrupted Swagger UI script then fails and the page stays blank.
server.servlet.encoding.force-response=true

# Document only the application API, not Spring Boot's management endpoints.
springdoc.paths-to-match=/api/**

# Optional local overrides from an untracked .env file (KEY=value lines) in the working directory.
spring.config.import=optional:file:.env[.properties]

# The Lambda adapter logs every environment variable at INFO on startup; keep it at WARN so any
# secrets added to the function's settings never reach the logs.
logging.level.com.amazonaws.serverless.proxy.spring.AwsSpringWebRuntimeInitializer=WARN
