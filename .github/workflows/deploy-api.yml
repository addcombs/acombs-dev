# Tests the API and deploys it to https://api.acombs-dev.com on every push to main that changes it,
# doing what scripts\build-lambda.ps1 and deploy-api.ps1 do for an existing function: upload the
# package, publish a SnapStart version and point the `live` alias at it. The function's settings
# (environment variables, memory, role) are left as deploy-api.ps1 set them. AWS access comes from
# the acombs-dev-github-deploy role through GitHub's OIDC token (see .github/aws).
name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - acombs-dev-api/**
      - .github/workflows/deploy-api.yml
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  AWS_ROLE: arn:aws:iam::814787355274:role/acombs-dev-github-deploy
  FUNCTION: acombs-dev-api
  DEPLOY_BUCKET: acombs-dev-deploy-814787355274
  DEPLOY_KEY: acombs-dev-api-lambda.zip

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acombs-dev-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Runs the unit tests, then builds target/*-lambda.zip.
      - run: mvn -P lambda --batch-mode --no-transfer-progress package

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update the function code
        run: |
          aws s3 cp target/*-lambda.zip "s3://$DEPLOY_BUCKET/$DEPLOY_KEY" --only-show-errors
          aws lambda update-function-code --function-name "$FUNCTION" \
            --s3-bucket "$DEPLOY_BUCKET" --s3-key "$DEPLOY_KEY" --query LastUpdateStatus --output text
          aws lambda wait function-updated-v2 --function-name "$FUNCTION"

      # SnapStart takes the snapshot while the version is published (a minute or two).
      - name: Publish a version and move the live alias
        run: |
          version=$(aws lambda publish-version --function-name "$FUNCTION" --query Version --output text)
          aws lambda wait published-version-active --function-name "$FUNCTION" --qualifier "$version"
          aws lambda update-alias --function-name "$FUNCTION" --name live --function-version "$version" \
            --query AliasArn --output text
          echo "live -> version $version"

      - name: Check the live API
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 https://api.acombs-dev.com/actuator/health
